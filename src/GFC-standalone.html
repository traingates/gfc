/* ============================================================================
   GFC — GLOBAL FIGHT CLUB  ·  STYLESHEET
   ----------------------------------------------------------------------------
   Design language: UFC-grade cinematic darkness × Minecraft voxel identity.
     · Near-black stage, single blood-red accent, gold reserved for champions.
     · Square "lava ember" particles, blocky notched card corners.
     · Condensed combat-poster display type + a pixel-font eyebrow signature.
   Organized in sections — search the ALL-CAPS headers to jump around.
   ============================================================================ */

/* ------------------------------------------------------------------ FONTS -- */
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Press+Start+2P&display=swap');

/* ------------------------------------------------------------- TOKENS ------ */
:root {
  /* Surfaces (black → charcoal → graphite) */
  --void:      #08080a;
  --stage:     #0c0c0f;
  --charcoal:  #141418;
  --graphite:  #1a1a20;
  --raised:    #202028;

  /* Lines & glass */
  --hairline:  rgba(255, 255, 255, 0.08);
  --hairline-2:rgba(255, 255, 255, 0.14);
  --glass:     rgba(20, 20, 24, 0.55);
  --glass-2:   rgba(28, 28, 34, 0.65);

  /* Accents */
  --blood:     #d32f2f;   /* primary red (from brief) */
  --blood-hi:  #ff3b30;   /* hot red for edges */
  --ember:     #ff5a2c;   /* lava-orange for particles/glow */
  --gold:      #f5c542;   /* champions & hall of fame only */

  /* Glows */
  --glow-red:  0 0 40px rgba(211, 47, 47, 0.35);
  --glow-red-strong: 0 0 60px rgba(211, 47, 47, 0.55);
  --glow-gold: 0 0 34px rgba(245, 197, 66, 0.45);

  /* Text */
  --bone:      #ecebe8;
  --silver:    #b7b7bf;
  --smoke:     #7c7c86;
  --faint:     #52525b;

  /* Type */
  --f-display: 'Anton', sans-serif;
  --f-head:    'Oswald', sans-serif;
  --f-body:    'Inter', sans-serif;
  --f-data:    'JetBrains Mono', monospace;
  --f-pixel:   'Press Start 2P', monospace;

  /* Rhythm */
  --nav-h: 72px;
  --pad-x: clamp(20px, 5vw, 72px);
  --maxw: 1240px;
  --radius: 4px;               /* small = blocky, not soft */
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
}

/* --------------------------------------------------------------- RESET ----- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--f-body);
  background: var(--void);
  color: var(--bone);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Ambient stage lighting — a slow red spotlight breathing behind everything */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(1100px 700px at 50% -10%, rgba(211, 47, 47, 0.14), transparent 60%),
    radial-gradient(900px 600px at 100% 100%, rgba(211, 47, 47, 0.06), transparent 60%),
    var(--void);
}

img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

::selection { background: var(--blood); color: #fff; }

/* Custom scrollbar */
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-track { background: var(--void); }
::-webkit-scrollbar-thumb { background: #2a2a32; border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--blood); }

/* ------------------------------------------------------- SHARED PRIMITIVES - */

/* Pixel-font eyebrow kicker — the Minecraft signature, used tiny + sparingly */
.kicker {
  font-family: var(--f-pixel);
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--blood);
  text-transform: uppercase;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  line-height: 1;
}
.kicker::before {
  content: "";
  width: 22px; height: 2px;
  background: linear-gradient(90deg, var(--blood), transparent);
}

.section {
  position: relative;
  z-index: 1;
  padding: clamp(56px, 9vw, 120px) var(--pad-x);
  max-width: var(--maxw);
  margin: 0 auto;
}

.section-head { margin-bottom: 48px; }
.section-title {
  font-family: var(--f-display);
  font-size: clamp(34px, 6vw, 68px);
  line-height: 0.94;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 14px;
}
.section-title .hl { color: var(--blood); }
.section-sub { color: var(--smoke); max-width: 60ch; margin-top: 14px; font-size: 15px; }

/* Blocky "notched corner" premium card — the voxel-bevel detail */
.card {
  position: relative;
  background: var(--glass);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  /* clip a chunk off the top-right corner → reads as a beveled voxel block */
  clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
  transition: transform 0.5s var(--ease), border-color 0.4s var(--ease), box-shadow 0.5s var(--ease);
}
.card:hover {
  transform: translateY(-6px);
  border-color: rgba(211, 47, 47, 0.5);
  box-shadow: var(--glow-red);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: var(--f-head);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 15px 30px;
  border-radius: var(--radius);
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), background 0.3s var(--ease), color 0.3s var(--ease);
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--blood); color: #fff; box-shadow: var(--glow-red); }
.btn-primary:hover { background: var(--blood-hi); box-shadow: var(--glow-red-strong); transform: translateY(-2px); }
.btn-ghost { background: rgba(255,255,255,0.03); color: var(--bone); border: 1px solid var(--hairline-2); }
.btn-ghost:hover { border-color: var(--blood); color: #fff; transform: translateY(-2px); box-shadow: var(--glow-red); }
.btn .arrow { transition: transform 0.3s var(--ease); }
.btn:hover .arrow { transform: translateX(4px); }

/* Skin render frame */
.skin-frame { position: relative; display: flex; align-items: flex-end; justify-content: center; }
.skin-frame img { image-rendering: pixelated; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6)); }
.skin-frame::after { /* ground shadow / spotlight puddle */
  content: ""; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 70%; height: 22px; border-radius: 50%;
  background: radial-gradient(ellipse, rgba(211,47,47,0.4), transparent 70%);
  filter: blur(4px);
}

/* Champion badge — gold pixel emblem, reserved for champions only */
.champ-badge {
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--f-pixel); font-size: 8px; letter-spacing: 0.5px;
  color: #1a1400; background: linear-gradient(180deg, #ffe37a, var(--gold));
  padding: 6px 9px; border-radius: 3px;
  box-shadow: var(--glow-gold);
  text-transform: uppercase;
  animation: badgePulse 2.4s ease-in-out infinite;
}
@keyframes badgePulse {
  0%, 100% { box-shadow: 0 0 20px rgba(245,197,66,0.35); }
  50%      { box-shadow: 0 0 38px rgba(245,197,66,0.65); }
}

/* Record pill / stat chips */
.record { font-family: var(--f-data); font-weight: 700; font-size: 14px; letter-spacing: 1px; }
.record .w { color: #57d977; }
.record .l { color: var(--blood-hi); }

/* =========================================================================
   LOADING SCREEN
   ========================================================================= */
#loader {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--void);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 26px;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}
#loader.done { opacity: 0; visibility: hidden; }
.loader-emblem { width: 96px; height: 96px; animation: loaderSpin 2.4s var(--ease) infinite; }
@keyframes loaderSpin {
  0%   { transform: rotateY(0deg)   scale(1); }
  50%  { transform: rotateY(180deg) scale(1.08); }
  100% { transform: rotateY(360deg) scale(1); }
}
.loader-word {
  font-family: var(--f-display); font-size: 40px; letter-spacing: 8px;
  color: var(--bone); text-transform: uppercase;
}
.loader-word span { color: var(--blood); }
.loader-bar { width: 220px; height: 3px; background: #1c1c22; border-radius: 3px; overflow: hidden; }
.loader-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--blood), var(--ember)); box-shadow: var(--glow-red); animation: loaderFill 1.5s var(--ease) forwards; }
@keyframes loaderFill { to { width: 100%; } }
.loader-tag { font-family: var(--f-pixel); font-size: 9px; color: var(--smoke); letter-spacing: 1px; }

/* =========================================================================
   PARTICLE CANVAS  (square lava embers — behind content)
   ========================================================================= */
#emberCanvas {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.9;
}

/* =========================================================================
   NAVIGATION  (fixed glass bar)
   ========================================================================= */
#nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--pad-x);
  background: rgba(8, 8, 10, 0.55);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid transparent;
  transition: background 0.4s var(--ease), border-color 0.4s var(--ease);
}
#nav.scrolled {
  background: rgba(8, 8, 10, 0.86);
  border-bottom: 1px solid var(--hairline);
}
.nav-brand { display: flex; align-items: center; gap: 12px; }
.nav-brand .emblem { width: 34px; height: 34px; }
.nav-brand .word { font-family: var(--f-display); font-size: 24px; letter-spacing: 3px; }
.nav-brand .word span { color: var(--blood); }

.nav-links { display: flex; align-items: center; gap: 6px; }
.nav-link {
  position: relative;
  font-family: var(--f-head); font-weight: 600; font-size: 13px;
  letter-spacing: 2px; text-transform: uppercase; color: var(--silver);
  padding: 10px 16px; border-radius: var(--radius);
  transition: color 0.25s var(--ease);
}
.nav-link:hover { color: #fff; }
.nav-link.active { color: #fff; }
.nav-link::after {
  content: ""; position: absolute; left: 16px; right: 16px; bottom: 4px; height: 2px;
  background: var(--blood); box-shadow: var(--glow-red);
  transform: scaleX(0); transform-origin: left; transition: transform 0.3s var(--ease);
}
.nav-link.active::after, .nav-link:hover::after { transform: scaleX(1); }

/* Mobile hamburger */
.nav-toggle { display: none; width: 40px; height: 40px; flex-direction: column; gap: 5px; align-items: center; justify-content: center; }
.nav-toggle span { width: 22px; height: 2px; background: var(--bone); transition: transform 0.3s var(--ease), opacity 0.3s var(--ease); }
.nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-toggle.open span:nth-child(2) { opacity: 0; }
.nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* =========================================================================
   VIEW / PAGE TRANSITIONS
   ========================================================================= */
#app { position: relative; z-index: 1; padding-top: var(--nav-h); }
.view { display: none; animation: viewIn 0.55s var(--ease); }
.view.active { display: block; }
@keyframes viewIn {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* =========================================================================
   HERO
   ========================================================================= */
.hero {
  position: relative;
  min-height: calc(100vh - var(--nav-h));
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
  padding: 60px var(--pad-x) 80px;
  overflow: hidden;
}
/* cinematic vignette + scanline atmosphere */
.hero::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(80% 60% at 50% 40%, transparent 40%, rgba(0,0,0,0.55) 100%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 3px);
}
.hero-emblem { width: clamp(90px, 14vw, 150px); height: clamp(90px, 14vw, 150px); margin-bottom: 22px; filter: drop-shadow(0 0 30px rgba(211,47,47,0.5)); animation: floatY 5s ease-in-out infinite; }
@keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

.hero-kicker { margin-bottom: 20px; }
.hero-title {
  font-family: var(--f-display);
  font-size: clamp(52px, 13vw, 168px);
  line-height: 0.86;
  letter-spacing: 1px;
  text-transform: uppercase;
  position: relative;
}
.hero-title .line2 { color: var(--blood); display: block; text-shadow: 0 0 60px rgba(211,47,47,0.5); }
.hero-sub {
  margin-top: 26px;
  font-family: var(--f-head); font-weight: 400;
  font-size: clamp(15px, 2.4vw, 22px); letter-spacing: 4px; text-transform: uppercase;
  color: var(--silver);
}
.hero-cta { margin-top: 44px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; z-index: 2; }

.hero-scroll {
  position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
  font-family: var(--f-pixel); font-size: 8px; color: var(--smoke); letter-spacing: 1px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.hero-scroll .dot { width: 5px; height: 5px; background: var(--blood); animation: scrollDot 1.6s ease-in-out infinite; }
@keyframes scrollDot { 0%,100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(8px); opacity: 0.3; } }

/* =========================================================================
   HOME · UPCOMING FIGHT + COUNTDOWN
   ========================================================================= */
.fight-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; }

/* main event card */
.main-event { padding: 34px; overflow: hidden; }
.main-event .event-name { font-family: var(--f-head); font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--blood); font-size: 13px; }
.main-event .belt { font-family: var(--f-pixel); font-size: 8px; color: var(--gold); margin-top: 8px; letter-spacing: 0.5px; }
.versus {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
  margin: 26px 0;
}
.vs-fighter { text-align: center; }
.vs-fighter .skin-frame img { height: 190px; }
.vs-fighter .name { font-family: var(--f-display); font-size: clamp(22px, 3vw, 34px); text-transform: uppercase; margin-top: 10px; letter-spacing: 1px; }
.vs-fighter .rec { font-family: var(--f-data); font-size: 12px; color: var(--smoke); }
.vs-mark { font-family: var(--f-display); font-size: clamp(30px, 5vw, 54px); color: var(--blood); text-shadow: var(--glow-red); }
.main-event .when {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  border-top: 1px solid var(--hairline); padding-top: 20px; margin-top: 6px;
  font-family: var(--f-head); letter-spacing: 2px; text-transform: uppercase; font-size: 14px; color: var(--silver);
}
.main-event .when b { color: var(--bone); }

/* countdown */
.countdown-card { padding: 30px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
.countdown-card h3 { font-family: var(--f-head); font-weight: 600; letter-spacing: 3px; text-transform: uppercase; font-size: 14px; color: var(--silver); }
.countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.cd-unit { text-align: center; background: rgba(0,0,0,0.35); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 16px 6px; }
.cd-unit .num { font-family: var(--f-display); font-size: clamp(26px, 5vw, 42px); color: var(--bone); line-height: 1; }
.cd-unit .lbl { font-family: var(--f-pixel); font-size: 7px; color: var(--smoke); margin-top: 8px; letter-spacing: 0.5px; }
.upnext-list { display: flex; flex-direction: column; gap: 10px; }
.upnext {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 14px; background: rgba(255,255,255,0.02); border: 1px solid var(--hairline); border-radius: var(--radius);
  font-size: 13px; transition: border-color 0.3s var(--ease), background 0.3s var(--ease);
}
.upnext:hover { border-color: rgba(211,47,47,0.4); background: rgba(211,47,47,0.05); }
.upnext .pair { font-family: var(--f-head); font-weight: 600; letter-spacing: 1px; }
.upnext .pair em { color: var(--blood); font-style: normal; margin: 0 6px; }
.upnext .d { font-family: var(--f-data); font-size: 11px; color: var(--smoke); }

/* =========================================================================
   HOME · STATS STRIP
   ========================================================================= */
.stats-strip {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
  background: var(--hairline); border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden;
}
.stat-cell { background: var(--charcoal); padding: 30px 20px; text-align: center; transition: background 0.4s var(--ease); }
.stat-cell:hover { background: var(--graphite); }
.stat-cell .num { font-family: var(--f-display); font-size: clamp(38px, 6vw, 60px); color: var(--blood); line-height: 1; text-shadow: var(--glow-red); }
.stat-cell .lbl { font-family: var(--f-head); letter-spacing: 2px; text-transform: uppercase; font-size: 12px; color: var(--smoke); margin-top: 10px; }

/* =========================================================================
   HOME · FEATURED FIGHTER
   ========================================================================= */
.featured { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 0; overflow: hidden; }
.featured .fl { position: relative; padding: 40px; background: linear-gradient(160deg, rgba(211,47,47,0.14), transparent 60%); display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--hairline); }
.featured .fl .skin-frame img { height: 300px; }
.featured .fr { padding: 44px; display: flex; flex-direction: column; justify-content: center; }
.featured .fr .name { font-family: var(--f-display); font-size: clamp(40px, 6vw, 72px); text-transform: uppercase; line-height: 0.9; }
.featured .fr .style { font-family: var(--f-head); letter-spacing: 3px; text-transform: uppercase; color: var(--blood); font-size: 14px; margin-top: 8px; }
.featured .fr .bio { color: var(--silver); margin: 20px 0 26px; font-size: 15px; max-width: 48ch; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.stat-box { background: rgba(0,0,0,0.3); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 18px; text-align: center; }
.stat-box .n { font-family: var(--f-display); font-size: 34px; line-height: 1; }
.stat-box .n.w { color: #57d977; }
.stat-box .n.l { color: var(--blood-hi); }
.stat-box .n.k { color: var(--gold); }
.stat-box .k-lbl { font-family: var(--f-pixel); font-size: 7px; color: var(--smoke); margin-top: 9px; letter-spacing: 0.5px; }

/* =========================================================================
   HOME · NEWS
   ========================================================================= */
.news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 22px; }
.news-card { padding: 26px; display: flex; flex-direction: column; cursor: pointer; }
.news-card .tag { align-self: flex-start; font-family: var(--f-pixel); font-size: 8px; color: var(--blood); border: 1px solid rgba(211,47,47,0.4); padding: 6px 8px; border-radius: 3px; letter-spacing: 0.5px; text-transform: uppercase; }
.news-card .n-title { font-family: var(--f-head); font-weight: 700; font-size: 21px; line-height: 1.15; margin: 18px 0 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.news-card .n-ex { color: var(--smoke); font-size: 14px; flex: 1; }
.news-card .n-date { font-family: var(--f-data); font-size: 11px; color: var(--faint); margin-top: 18px; }
.news-card .read { color: var(--blood); font-family: var(--f-head); font-weight: 600; letter-spacing: 2px; text-transform: uppercase; font-size: 12px; margin-top: 16px; opacity: 0; transform: translateX(-6px); transition: opacity 0.3s var(--ease), transform 0.3s var(--ease); }
.news-card:hover .read { opacity: 1; transform: translateX(0); }

/* =========================================================================
   HOME · HALL OF FAME
   ========================================================================= */
.hof-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
.hof-card { padding: 26px 22px; text-align: center; border-color: rgba(245,197,66,0.16); }
.hof-card:hover { border-color: rgba(245,197,66,0.5); box-shadow: var(--glow-gold); }
.hof-card .skin-frame img { height: 130px; }
.hof-card .skin-frame::after { background: radial-gradient(ellipse, rgba(245,197,66,0.4), transparent 70%); }
.hof-card .hof-name { font-family: var(--f-display); font-size: 26px; text-transform: uppercase; margin-top: 14px; }
.hof-card .hof-year { font-family: var(--f-pixel); font-size: 8px; color: var(--gold); margin-top: 6px; }
.hof-card .hof-note { color: var(--smoke); font-size: 13px; margin-top: 10px; }

/* =========================================================================
   HOME · SPONSORS
   ========================================================================= */
.sponsors { border-top: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline); padding: 40px var(--pad-x); }
.sponsors-inner { max-width: var(--maxw); margin: 0 auto; }
.sponsors .lbl { text-align: center; font-family: var(--f-pixel); font-size: 9px; color: var(--faint); letter-spacing: 1px; margin-bottom: 26px; }
.sponsor-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 40px 56px; }
.sponsor {
  font-family: var(--f-head); font-weight: 700; font-size: clamp(16px, 2.4vw, 24px);
  letter-spacing: 3px; color: var(--faint); text-transform: uppercase;
  transition: color 0.3s var(--ease), transform 0.3s var(--ease); filter: grayscale(1);
}
.sponsor:hover { color: var(--silver); transform: translateY(-2px); }

/* =========================================================================
   FIGHTERS PAGE
   ========================================================================= */
.fighters-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 34px; flex-wrap: wrap; }
.search {
  display: flex; align-items: center; gap: 12px;
  background: var(--glass); border: 1px solid var(--hairline); border-radius: var(--radius);
  padding: 12px 18px; min-width: 280px; flex: 1; max-width: 420px;
  transition: border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
}
.search:focus-within { border-color: var(--blood); box-shadow: var(--glow-red); }
.search svg { width: 18px; height: 18px; color: var(--smoke); flex-shrink: 0; }
.search input { flex: 1; background: none; border: none; outline: none; color: var(--bone); font-family: var(--f-body); font-size: 15px; }
.search input::placeholder { color: var(--faint); }
.roster-count { font-family: var(--f-data); font-size: 13px; color: var(--smoke); }

.roster { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 22px; }
.fighter-card { padding: 24px 22px 22px; cursor: pointer; text-align: center; }
.fighter-card .rank-tag { position: absolute; top: 14px; left: 14px; font-family: var(--f-display); font-size: 20px; color: var(--faint); }
.fighter-card .champ-mini { position: absolute; top: 12px; right: 12px; }
.fighter-card .skin-frame { margin-top: 10px; }
.fighter-card .skin-frame img { height: 170px; transition: transform 0.5s var(--ease); }
.fighter-card:hover .skin-frame img { transform: translateY(-6px) scale(1.04); }
.fighter-card .fc-name { font-family: var(--f-display); font-size: 26px; text-transform: uppercase; margin-top: 16px; letter-spacing: 0.5px; }
.fighter-card .fc-style { font-family: var(--f-head); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--blood); margin-top: 4px; }
.fighter-card .fc-foot { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--hairline); }
.fighter-card .fc-rank { font-family: var(--f-data); font-size: 12px; color: var(--smoke); }
.no-results { grid-column: 1 / -1; text-align: center; color: var(--smoke); padding: 60px 0; font-family: var(--f-head); letter-spacing: 2px; text-transform: uppercase; }

/* =========================================================================
   FIGHTER MODAL
   ========================================================================= */
#modal {
  position: fixed; inset: 0; z-index: 200;
  display: none; align-items: center; justify-content: center;
  padding: 24px;
  background: rgba(4,4,6,0.8); backdrop-filter: blur(8px);
}
#modal.open { display: flex; animation: fadeIn 0.3s var(--ease); }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-box {
  position: relative;
  width: min(880px, 100%); max-height: 88vh; overflow-y: auto;
  background: var(--charcoal); border: 1px solid var(--hairline-2); border-radius: var(--radius);
  box-shadow: 0 40px 120px rgba(0,0,0,0.7), var(--glow-red);
  animation: modalIn 0.45s var(--ease);
}
@keyframes modalIn { from { transform: translateY(30px) scale(0.97); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-close {
  position: absolute; top: 16px; right: 16px; z-index: 3;
  width: 40px; height: 40px; border-radius: var(--radius);
  background: rgba(0,0,0,0.5); border: 1px solid var(--hairline); color: var(--silver);
  font-size: 22px; line-height: 1; transition: all 0.3s var(--ease);
}
.modal-close:hover { background: var(--blood); color: #fff; border-color: var(--blood); }
.modal-hero { display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 0; }
.modal-hero .ml { padding: 40px; background: linear-gradient(160deg, rgba(211,47,47,0.18), transparent 65%); display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--hairline); }
.modal-hero .ml .skin-frame img { height: 280px; }
.modal-hero .mr { padding: 40px 40px 30px; }
.modal-hero .m-name { font-family: var(--f-display); font-size: clamp(38px, 6vw, 64px); text-transform: uppercase; line-height: 0.9; }
.modal-hero .m-style { font-family: var(--f-head); letter-spacing: 3px; text-transform: uppercase; color: var(--blood); font-size: 13px; margin-top: 8px; }
.modal-hero .m-bio { color: var(--silver); font-size: 14px; margin: 18px 0 22px; }
.m-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.m-stat { background: rgba(0,0,0,0.3); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 14px 8px; text-align: center; }
.m-stat .n { font-family: var(--f-display); font-size: 28px; line-height: 1; }
.m-stat .n.w { color: #57d977; } .m-stat .n.l { color: var(--blood-hi); } .m-stat .n.k { color: var(--gold); } .m-stat .n.s { color: var(--bone); }
.m-stat .l2 { font-family: var(--f-pixel); font-size: 6px; color: var(--smoke); margin-top: 8px; letter-spacing: 0.5px; }
.modal-history { padding: 10px 40px 40px; }
.modal-history h4 { font-family: var(--f-head); letter-spacing: 3px; text-transform: uppercase; font-size: 13px; color: var(--smoke); margin-bottom: 16px; }
.hist-row {
  display: grid; grid-template-columns: 44px 1fr auto auto; align-items: center; gap: 14px;
  padding: 12px 16px; background: rgba(255,255,255,0.02); border: 1px solid var(--hairline);
  border-radius: var(--radius); margin-bottom: 8px;
}
.hist-row .badge { font-family: var(--f-display); font-size: 18px; text-align: center; border-radius: 3px; padding: 4px 0; }
.hist-row .badge.w { color: #57d977; background: rgba(87,217,119,0.1); }
.hist-row .badge.l { color: var(--blood-hi); background: rgba(255,59,48,0.1); }
.hist-row .op { font-family: var(--f-head); font-weight: 600; letter-spacing: 0.5px; }
.hist-row .mth { font-family: var(--f-data); font-size: 12px; color: var(--silver); }
.hist-row .ev { font-family: var(--f-data); font-size: 11px; color: var(--faint); }

/* =========================================================================
   RANKINGS
   ========================================================================= */
.rank-list { display: flex; flex-direction: column; gap: 12px; }
.rank-row {
  display: grid; grid-template-columns: 70px 76px 1fr auto auto; align-items: center; gap: 18px;
  padding: 16px 24px; background: var(--glass); border: 1px solid var(--hairline);
  border-radius: var(--radius); cursor: pointer;
  transition: transform 0.4s var(--ease), border-color 0.4s var(--ease), box-shadow 0.4s var(--ease);
}
.rank-row:hover { transform: translateX(6px); border-color: rgba(211,47,47,0.5); box-shadow: var(--glow-red); }
.rank-row .r-num { font-family: var(--f-display); font-size: 40px; color: var(--faint); line-height: 1; }
.rank-row.champ { border-color: rgba(245,197,66,0.4); background: linear-gradient(90deg, rgba(245,197,66,0.08), transparent 50%); }
.rank-row.champ:hover { box-shadow: var(--glow-gold); border-color: rgba(245,197,66,0.7); }
.rank-row.champ .r-num { color: var(--gold); text-shadow: var(--glow-gold); }
.rank-row .r-skin { width: 56px; display: flex; justify-content: center; }
.rank-row .r-skin img { height: 66px; image-rendering: pixelated; }
.rank-row .r-name { font-family: var(--f-display); font-size: clamp(22px, 3vw, 30px); text-transform: uppercase; letter-spacing: 0.5px; }
.rank-row .r-style { font-family: var(--f-head); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--smoke); }
.rank-row .r-rec { font-family: var(--f-data); font-weight: 700; font-size: 16px; letter-spacing: 1px; }
.rank-row .r-ko { font-family: var(--f-data); font-size: 12px; color: var(--gold); text-align: right; }

/* =========================================================================
   HISTORY  (timeline + posters)
   ========================================================================= */
.timeline { position: relative; padding-left: 40px; }
.timeline::before { content: ""; position: absolute; left: 12px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(180deg, var(--blood), transparent); }
.tl-item { position: relative; margin-bottom: 16px; }
.tl-item::before { content: ""; position: absolute; left: -34px; top: 22px; width: 12px; height: 12px; background: var(--blood); box-shadow: var(--glow-red); }
.tl-head {
  display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 16px;
  padding: 20px 24px; background: var(--glass); border: 1px solid var(--hairline);
  border-radius: var(--radius); cursor: pointer; transition: border-color 0.3s var(--ease), background 0.3s var(--ease);
}
.tl-head:hover { border-color: rgba(211,47,47,0.5); }
.tl-event { font-family: var(--f-display); font-size: clamp(20px, 3vw, 28px); text-transform: uppercase; letter-spacing: 0.5px; }
.tl-date { font-family: var(--f-data); font-size: 12px; color: var(--smoke); }
.tl-result { display: flex; align-items: center; gap: 8px; font-family: var(--f-head); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; }
.tl-result .win { color: #57d977; }
.tl-result .via { font-family: var(--f-pixel); font-size: 7px; padding: 5px 7px; border-radius: 3px; letter-spacing: 0.5px; }
.tl-result .via.ko { background: rgba(255,59,48,0.14); color: var(--blood-hi); }
.tl-result .via.decision { background: rgba(255,255,255,0.06); color: var(--silver); }
.tl-result .via.forfeit { background: rgba(245,197,66,0.14); color: var(--gold); }
.tl-chev { color: var(--smoke); transition: transform 0.3s var(--ease); }
.tl-item.open .tl-chev { transform: rotate(90deg); }
.tl-body { max-height: 0; overflow: hidden; transition: max-height 0.45s var(--ease); }
.tl-item.open .tl-body { max-height: 260px; }
.tl-body-inner { padding: 18px 24px; color: var(--silver); font-size: 14px; border: 1px solid var(--hairline); border-top: none; border-radius: 0 0 var(--radius) var(--radius); background: rgba(0,0,0,0.25); }
.tl-body-inner .lose { color: var(--smoke); }

/* poster gallery */
.poster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
.poster {
  position: relative; aspect-ratio: 3/4; overflow: hidden; border-radius: var(--radius);
  border: 1px solid var(--hairline); cursor: pointer;
  background: radial-gradient(120% 80% at 50% 0%, rgba(211,47,47,0.35), transparent 55%), linear-gradient(180deg, #16161b, #0a0a0d);
  transition: transform 0.5s var(--ease), box-shadow 0.5s var(--ease), border-color 0.5s var(--ease);
}
.poster:hover { transform: translateY(-8px) scale(1.02); box-shadow: var(--glow-red-strong); border-color: var(--blood); }
.poster .p-top { position: absolute; top: 16px; left: 0; right: 0; text-align: center; z-index: 2; }
.poster .p-event { font-family: var(--f-display); font-size: 30px; letter-spacing: 2px; }
.poster .p-sub { font-family: var(--f-pixel); font-size: 8px; color: var(--blood); margin-top: 6px; letter-spacing: 0.5px; }
.poster .p-fighters { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; gap: 0; }
.poster .p-fighters img { height: 62%; image-rendering: pixelated; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6)); }
.poster .p-fighters img:first-child { transform: scaleX(-1); margin-right: -14px; }
.poster .p-vs { position: absolute; top: 46%; left: 50%; transform: translate(-50%,-50%); font-family: var(--f-display); font-size: 40px; color: var(--blood); text-shadow: var(--glow-red); z-index: 3; }
.poster .p-date { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font-family: var(--f-head); font-weight: 700; letter-spacing: 4px; font-size: 14px; color: var(--bone); z-index: 2; }
.poster::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.6)); pointer-events: none; }

/* =========================================================================
   INFO PAGE
   ========================================================================= */
.info-block { margin-bottom: 64px; }
.info-lead { font-size: clamp(17px, 2.4vw, 21px); color: var(--silver); max-width: 68ch; line-height: 1.7; }

.how-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
.how-card { padding: 28px 24px; }
.how-card .idx { font-family: var(--f-display); font-size: 44px; color: rgba(211,47,47,0.9); line-height: 1; }
.how-card h4 { font-family: var(--f-head); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-size: 18px; margin: 12px 0 8px; }
.how-card p { color: var(--smoke); font-size: 14px; }

.rules-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.rule-item { display: flex; gap: 14px; padding: 18px 20px; background: var(--glass); border: 1px solid var(--hairline); border-radius: var(--radius); }
.rule-item .rn { font-family: var(--f-pixel); font-size: 10px; color: var(--blood); flex-shrink: 0; padding-top: 3px; }
.rule-item p { color: var(--silver); font-size: 14px; }

.faq-list { display: flex; flex-direction: column; gap: 10px; max-width: 820px; }
.faq-item { background: var(--glass); border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; }
.faq-q { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 24px; cursor: pointer; font-family: var(--f-head); font-weight: 600; letter-spacing: 0.5px; font-size: 17px; transition: color 0.3s var(--ease); }
.faq-q:hover { color: var(--blood); }
.faq-q .pm { color: var(--blood); font-size: 22px; transition: transform 0.3s var(--ease); flex-shrink: 0; }
.faq-item.open .faq-q .pm { transform: rotate(45deg); }
.faq-a { max-height: 0; overflow: hidden; transition: max-height 0.4s var(--ease); }
.faq-item.open .faq-a { max-height: 220px; }
.faq-a p { padding: 0 24px 22px; color: var(--smoke); font-size: 15px; }

.staff-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
.staff-card { padding: 26px 22px; text-align: center; }
.staff-card .skin-frame img { height: 120px; }
.staff-card .s-name { font-family: var(--f-head); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-size: 19px; margin-top: 14px; }
.staff-card .s-role { font-family: var(--f-pixel); font-size: 7px; color: var(--blood); margin-top: 8px; letter-spacing: 0.5px; }
.staff-card .s-note { color: var(--smoke); font-size: 13px; margin-top: 12px; }

.info-cta {
  text-align: center; padding: 60px 30px; margin-top: 30px;
  background: radial-gradient(80% 100% at 50% 0%, rgba(211,47,47,0.14), transparent 60%);
  border: 1px solid var(--hairline); border-radius: var(--radius);
}
.info-cta h3 { font-family: var(--f-display); font-size: clamp(30px, 5vw, 52px); text-transform: uppercase; }
.info-cta p { color: var(--silver); margin: 12px 0 26px; }

/* =========================================================================
   FOOTER
   ========================================================================= */
footer {
  position: relative; z-index: 1;
  border-top: 1px solid var(--hairline);
  padding: 50px var(--pad-x) 40px;
  text-align: center;
}
footer .f-brand { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 18px; }
footer .f-brand .emblem { width: 34px; height: 34px; }
footer .f-brand .word { font-family: var(--f-display); font-size: 26px; letter-spacing: 3px; }
footer .f-brand .word span { color: var(--blood); }
footer .f-links { display: flex; gap: 26px; justify-content: center; flex-wrap: wrap; margin-bottom: 22px; }
footer .f-links a { font-family: var(--f-head); font-weight: 600; letter-spacing: 2px; text-transform: uppercase; font-size: 12px; color: var(--smoke); transition: color 0.3s var(--ease); }
footer .f-links a:hover { color: var(--blood); }
footer .f-copy { font-family: var(--f-data); font-size: 11px; color: var(--faint); }
footer .f-copy .pix { font-family: var(--f-pixel); font-size: 7px; }

/* =========================================================================
   SCROLL REVEAL
   ========================================================================= */
.reveal { opacity: 0; transform: translateY(28px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
.reveal.in { opacity: 1; transform: none; }

/* =========================================================================
   RESPONSIVE
   ========================================================================= */
@media (max-width: 960px) {
  .fight-grid { grid-template-columns: 1fr; }
  .featured { grid-template-columns: 1fr; }
  .featured .fl { border-right: none; border-bottom: 1px solid var(--hairline); }
  .modal-hero { grid-template-columns: 1fr; }
  .modal-hero .ml { border-right: none; border-bottom: 1px solid var(--hairline); }
  .stats-strip { grid-template-columns: repeat(2, 1fr); }
  .rank-row { grid-template-columns: 54px 60px 1fr auto; }
  .rank-row .r-ko { display: none; }
}

@media (max-width: 720px) {
  .nav-links {
    position: fixed; top: var(--nav-h); left: 0; right: 0;
    flex-direction: column; align-items: stretch; gap: 0;
    background: rgba(8,8,10,0.97); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--hairline);
    padding: 12px var(--pad-x) 20px;
    transform: translateY(-120%); transition: transform 0.4s var(--ease);
    max-height: calc(100vh - var(--nav-h)); overflow-y: auto;
  }
  .nav-links.open { transform: translateY(0); }
  .nav-link { padding: 16px 8px; font-size: 15px; border-bottom: 1px solid var(--hairline); }
  .nav-link::after { display: none; }
  .nav-toggle { display: flex; }

  .versus { grid-template-columns: 1fr; gap: 6px; }
  .vs-fighter .skin-frame img { height: 150px; }
  .vs-mark { margin: 4px 0; }
  .m-stats { grid-template-columns: repeat(2, 1fr); }
  .hist-row { grid-template-columns: 40px 1fr auto; }
  .hist-row .ev { display: none; }
  .tl-head { grid-template-columns: 1fr auto; }
  .tl-head .tl-result { grid-column: 1 / -1; }
  .rank-row { grid-template-columns: 46px 1fr auto; gap: 12px; }
  .rank-row .r-skin { display: none; }
  .rank-row .r-num { font-size: 30px; }
}

@media (max-width: 460px) {
  .stats-strip { grid-template-columns: 1fr; }
  .hero-cta { flex-direction: column; width: 100%; }
  .hero-cta .btn { width: 100%; }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
  .reveal { opacity: 1; transform: none; }
}

/* Keyboard focus visibility */
:focus-visible { outline: 2px solid var(--blood); outline-offset: 3px; }

/* ============================================================================
   LOGO IMAGE  ·  the GFC wordmark used in nav / hero / footer / loader / admin
   ============================================================================ */
.brand-logo { display: block; width: auto; height: auto; max-width: 100%; user-select: none; }
.nav-logo    { height: 30px; }
.foot-logo   { height: 34px; }
.hero-logo   { width: clamp(120px, 20vw, 190px); margin: 0 auto 6px; filter: drop-shadow(0 0 26px rgba(211,47,47,0.28)); }
.loader-logo { width: 160px; margin-bottom: 30px; animation: logoPulse 2.2s var(--ease) infinite; }
.empty-logo  { width: 64px; opacity: 0.22; }
.admin-logo  { height: 26px; }
.al-logo-img { height: 42px; }

@keyframes logoPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.72; transform: scale(0.97); } }

/* Center the mark above the hero headline */
.hero-logo-wrap { display: flex; justify-content: center; margin-bottom: 14px; }

/* ============================================================================
   EMPTY STATES  ·  shown when a section has nothing logged yet
   ============================================================================ */
.empty-state {
  text-align: center; padding: 64px 24px; border: 1px dashed var(--hairline-2);
  border-radius: var(--radius); background: var(--glass); margin: 8px 0;
}
.empty-mark { margin-bottom: 18px; display: flex; justify-content: center; }
.empty-title { font-family: var(--f-head); font-size: 20px; letter-spacing: 1px; color: var(--silver); text-transform: uppercase; }
.empty-sub { margin-top: 8px; color: var(--smoke); font-size: 14px; max-width: 440px; margin-left: auto; margin-right: auto; }

/* ============================================================================
   ADMIN PANEL  ·  password-gated content manager (route #admin)
   ============================================================================ */
.admin-link { color: var(--faint); text-decoration: none; transition: color .2s; }
.admin-link:hover { color: var(--blood); }

body.in-admin #footer { display: none; }           /* keep the editor focused */
#view-admin { padding: calc(var(--nav-h) + 28px) var(--pad-x) 80px; max-width: 1100px; margin: 0 auto; }

/* --- Login gate --- */
.admin-login { min-height: 62vh; display: flex; align-items: center; justify-content: center; }
.al-card {
  width: min(400px, 100%); text-align: center; padding: 40px 34px;
  background: var(--glass-2); border: 1px solid var(--hairline-2); border-radius: var(--radius);
  backdrop-filter: blur(8px); box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}
.al-logo { margin-bottom: 20px; display: flex; justify-content: center; }
.al-card h2 { font-family: var(--f-display); font-size: 30px; letter-spacing: 3px; }
.al-card p { color: var(--smoke); font-size: 14px; margin: 8px 0 22px; }
.al-card input[type=password],
.al-card input[type=email] {
  width: 100%; padding: 13px 15px; margin-bottom: 14px; font-family: var(--f-data); font-size: 15px;
  color: var(--bone); background: var(--void); border: 1px solid var(--hairline-2); border-radius: var(--radius);
  outline: none; transition: border-color .2s;
}
.al-card input[type=password]:focus, .al-card input[type=email]:focus { border-color: var(--blood); }
.al-card .btn { width: 100%; justify-content: center; }
.al-err { color: var(--blood-hi); font-size: 13px; min-height: 18px; margin-top: 10px; }
.al-back { margin-top: 10px; font-size: 13px; }

/* --- Shell --- */
.admin-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.admin-brand { display: flex; align-items: center; gap: 12px; }
.admin-brand span { font-family: var(--f-head); text-transform: uppercase; letter-spacing: 2px; color: var(--silver); font-size: 15px; }
.admin-head-actions { display: flex; gap: 8px; }

.admin-warn {
  background: rgba(211,47,47,0.08); border: 1px solid rgba(211,47,47,0.35); color: #f4b9b9;
  padding: 12px 16px; border-radius: var(--radius); font-size: 13.5px; line-height: 1.5; margin-bottom: 20px;
}
.admin-warn b { color: #fff; }

.admin-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; border-bottom: 1px solid var(--hairline); padding-bottom: 14px; }
.atab {
  font-family: var(--f-head); text-transform: uppercase; letter-spacing: 1px; font-size: 12.5px;
  padding: 8px 14px; color: var(--smoke); background: var(--charcoal); border: 1px solid var(--hairline);
  border-radius: var(--radius); cursor: pointer; transition: all .15s;
}
.atab:hover { color: var(--bone); border-color: var(--hairline-2); }
.atab.on { color: #fff; background: var(--blood); border-color: var(--blood); box-shadow: var(--glow-red); }

/* --- Panels & lists --- */
.admin-panel { background: var(--glass); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 22px; }
.admin-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.admin-panel-head h3 { font-family: var(--f-head); text-transform: uppercase; letter-spacing: 1.5px; font-size: 18px; color: var(--bone); }
.admin-note { color: var(--smoke); font-size: 13px; line-height: 1.6; margin: -4px 0 16px; }
.admin-note code, .admin-note b { color: var(--silver); }
.admin-hr { border: none; border-top: 1px solid var(--hairline); margin: 28px 0 20px; }

.alist { display: flex; flex-direction: column; gap: 8px; }
.arow {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 14px; background: var(--charcoal); border: 1px solid var(--hairline); border-radius: var(--radius);
}
.arow-title { font-family: var(--f-body); font-weight: 600; color: var(--bone); font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arow-actions { display: flex; gap: 6px; flex-shrink: 0; }

.admin-empty { padding: 26px 16px; text-align: center; color: var(--smoke); font-size: 14px; border: 1px dashed var(--hairline-2); border-radius: var(--radius); }
.admin-empty.sm { padding: 14px; font-size: 13px; }

/* --- Forms --- */
.admin-form { display: flex; flex-direction: column; gap: 14px; }
.afield { display: flex; flex-direction: column; gap: 5px; }
.afield-label, .afield > span:first-child { font-family: var(--f-head); text-transform: uppercase; letter-spacing: 1px; font-size: 11.5px; color: var(--silver); }
.afield-hint { font-size: 11.5px; color: var(--faint); font-family: var(--f-body); text-transform: none; letter-spacing: 0; margin-top: -2px; }
.afield input[type=text], .afield input[type=number], .afield textarea, .afield select {
  width: 100%; padding: 10px 12px; font-family: var(--f-body); font-size: 14px; color: var(--bone);
  background: var(--void); border: 1px solid var(--hairline-2); border-radius: var(--radius); outline: none; transition: border-color .15s;
}
.afield textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
.afield input:focus, .afield textarea:focus, .afield select:focus { border-color: var(--blood); }
.afield select { cursor: pointer; }
.afield-bool { flex-direction: row; align-items: center; gap: 10px; }
.afield-bool input { width: 18px; height: 18px; accent-color: var(--blood); cursor: pointer; }
.afield-bool span { font-family: var(--f-body); text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--bone); }

/* repeating sub-rows (fight history, FAQ, staff…) */
.afield-rows { gap: 8px; padding: 14px; background: var(--stage); border: 1px solid var(--hairline); border-radius: var(--radius); }
.rows-wrap { display: flex; flex-direction: column; gap: 10px; }
.arow-sub { padding: 12px; background: var(--charcoal); border: 1px solid var(--hairline); border-radius: var(--radius); }
.arow-sub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 8px; }

.form-actions { display: flex; gap: 10px; align-items: center; margin-top: 20px; flex-wrap: wrap; }

/* --- Rankings ladder --- */
.ra-list { display: flex; flex-direction: column; gap: 6px; }
.ra-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--charcoal); border: 1px solid var(--hairline); border-radius: var(--radius); }
.ra-rank { font-family: var(--f-data); font-size: 14px; color: var(--silver); min-width: 42px; }
.ra-champ { color: var(--gold); }
.ra-name { flex: 1; font-family: var(--f-body); font-weight: 600; color: var(--bone); font-size: 14.5px; }
.ra-rec { font-family: var(--f-data); color: var(--smoke); font-size: 12px; margin-left: 10px; }
.ra-actions { display: flex; gap: 6px; }
.ra-add { display: flex; gap: 8px; margin-top: 14px; }
.ra-add select { flex: 1; padding: 10px 12px; background: var(--void); color: var(--bone); border: 1px solid var(--hairline-2); border-radius: var(--radius); font-family: var(--f-body); font-size: 14px; outline: none; }

/* --- Small buttons --- */
.btn-sm, .btn-xs {
  font-family: var(--f-head); text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
  background: var(--raised); color: var(--bone); border: 1px solid var(--hairline-2); border-radius: var(--radius); transition: all .15s; white-space: nowrap;
}
.btn-sm { font-size: 12.5px; padding: 9px 16px; }
.btn-xs { font-size: 11px; padding: 6px 11px; }
.btn-sm:hover, .btn-xs:hover { border-color: var(--blood); color: #fff; }
.btn-sm:disabled, .btn-xs:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-sm.btn-ghost, .btn-xs.btn-ghost { background: transparent; }
.btn-danger { color: #f0a0a0; border-color: rgba(211,47,47,0.4); }
.btn-danger:hover { background: var(--blood); color: #fff; border-color: var(--blood); }

/* --- Toast --- */
.toast {
  position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 20px);
  background: var(--blood); color: #fff; font-family: var(--f-head); text-transform: uppercase; letter-spacing: 1.5px;
  font-size: 13px; padding: 12px 22px; border-radius: var(--radius); box-shadow: var(--glow-red-strong);
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 4000;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 560px) {
  .admin-head-actions { width: 100%; }
  .arow-sub-grid { grid-template-columns: 1fr; }
}

/* Ensure <button> elements using .btn get proper styling (base .btn omits
   background/cursor because the hero uses <a> with .btn-primary/.btn-ghost). */
button.btn, button.btn-sm, button.btn-xs { -webkit-appearance: none; appearance: none; }
.admin button, .al-card button, .empty-state button { cursor: pointer; }
.admin .btn:not(.btn-primary):not(.btn-ghost),
.al-card .btn { background: var(--blood); color: #fff; box-shadow: var(--glow-red); border: none; }
.admin .btn:not(.btn-primary):not(.btn-ghost):hover,
.al-card .btn:hover { background: var(--blood-hi); box-shadow: var(--glow-red-strong); }
/* Admin Save buttons don't need the oversized hero padding */
.admin .btn, .al-card .btn { padding: 13px 26px; font-size: 13px; }

/* ============================================================================
   VIDEOS · the media / broadcast hub (route #videos)
   ============================================================================ */
.vsection { }
.v-count { font-family: var(--f-data); font-size: 12px; color: var(--smoke); margin-top: 10px; }

/* ---- Featured: LIVE ------------------------------------------------------- */
.live-wrap {
  display: grid; grid-template-columns: 1.65fr 1fr; gap: 26px; align-items: stretch;
  margin-top: 6px;
}
.live-player {
  position: relative; aspect-ratio: 16 / 9; width: 100%;
  background: #000; border-radius: var(--radius); overflow: hidden;
  border: 1px solid rgba(211,47,47,0.5);
  box-shadow: var(--glow-red-strong);
  animation: livePulse 2.6s var(--ease) infinite;
}
.live-player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.live-thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.82; }
.live-player.no-thumb { background: linear-gradient(135deg, #1a0808, #0a0a0e); }
.live-play {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2;
  width: 88px; height: 88px; border-radius: 50%; cursor: pointer;
  background: rgba(211,47,47,0.92); border: 2px solid rgba(255,255,255,0.85);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 10px 40px rgba(211,47,47,0.6); transition: transform 0.25s var(--ease), background 0.25s var(--ease);
}
.live-play:hover { transform: translate(-50%, -50%) scale(1.08); background: var(--blood-hi); }
.tri { width: 0; height: 0; border-style: solid; border-width: 13px 0 13px 22px; border-color: transparent transparent transparent #fff; margin-left: 5px; }
.live-badge {
  position: absolute; top: 14px; left: 14px; z-index: 3;
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--f-head); font-weight: 700; letter-spacing: 2px; font-size: 12px;
  color: #fff; background: var(--blood); padding: 7px 12px; border-radius: 3px;
  box-shadow: var(--glow-red);
}
.live-dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: liveDot 1.2s ease-in-out infinite; }
.live-ring {
  position: absolute; inset: 0; border-radius: var(--radius); pointer-events: none; z-index: 1;
  border: 2px solid rgba(255,59,48,0.55); animation: liveRing 2.6s var(--ease) infinite;
}
.live-meta { display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.live-kicker { font-family: var(--f-head); text-transform: uppercase; letter-spacing: 3px; font-size: 12px; color: var(--blood); }
.live-title { font-family: var(--f-display); font-size: clamp(28px, 4vw, 46px); line-height: 1.02; text-transform: uppercase; }
.live-facts { display: flex; flex-wrap: wrap; gap: 10px 20px; }
.lf { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-data); font-size: 13px; color: var(--silver); }
.lf-i { color: var(--blood); }
.live-cta { align-self: flex-start; margin-top: 6px; }

@keyframes livePulse {
  0%, 100% { box-shadow: 0 0 40px rgba(211,47,47,0.35); border-color: rgba(211,47,47,0.5); }
  50%      { box-shadow: 0 0 66px rgba(211,47,47,0.6);  border-color: rgba(255,59,48,0.85); }
}
@keyframes liveRing { 0%,100% { opacity: 0.25; } 50% { opacity: 0.85; } }
@keyframes liveDot  { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }

/* ---- Featured: OFFLINE ---------------------------------------------------- */
.live-off { display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; margin-top: 6px; }
.off-plate {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 12px; min-height: 300px; padding: 40px;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 12px, transparent 12px 24px), var(--stage);
  border: 1px dashed var(--hairline-2); border-radius: var(--radius);
}
.off-logo { width: 92px; opacity: 0.28; }
.off-title { font-family: var(--f-head); text-transform: uppercase; letter-spacing: 2px; font-size: 20px; color: var(--silver); }
.off-sub { color: var(--smoke); font-size: 14px; max-width: 320px; }
.next-event {
  display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 30px;
  background: var(--glass); border: 1px solid var(--hairline); border-radius: var(--radius);
}
.ne-kicker { font-family: var(--f-head); text-transform: uppercase; letter-spacing: 3px; font-size: 12px; color: var(--blood); }
.ne-title { font-family: var(--f-display); font-size: clamp(24px, 3vw, 34px); text-transform: uppercase; line-height: 1; }
.ne-vs { font-family: var(--f-head); color: var(--silver); font-size: 15px; }
.ne-vs em { color: var(--blood); font-style: normal; margin: 0 6px; }
.ne-countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 4px; }
.ne-empty { align-items: flex-start; }
.ne-none { color: var(--smoke); font-size: 14px; }

/* ---- Featured Events carousel -------------------------------------------- */
.caro-wrap { position: relative; }
.caro-track {
  display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory;
  padding: 4px 2px 14px; scrollbar-width: thin;
}
.caro-track::-webkit-scrollbar { height: 8px; }
.caro-track::-webkit-scrollbar-thumb { background: var(--graphite); border-radius: 8px; }
.vcard-caro { flex: 0 0 clamp(260px, 30vw, 340px); scroll-snap-align: start; }
.caro-arrow {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 4;
  width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
  background: rgba(10,10,14,0.85); border: 1px solid var(--hairline-2); color: var(--bone);
  font-size: 24px; line-height: 1; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
}
.caro-arrow:hover { background: var(--blood); border-color: var(--blood); color: #fff; }
.caro-arrow.left { left: -12px; }
.caro-arrow.right { right: -12px; }

/* ---- Toolbar (search / sort / filters) ------------------------------------ */
.v-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 22px; }
.v-search { position: relative; flex: 1 1 260px; min-width: 220px; }
.v-search-i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--smoke); font-size: 16px; pointer-events: none; }
.v-search input {
  width: 100%; padding: 12px 14px 12px 38px; font-family: var(--f-body); font-size: 14px; color: var(--bone);
  background: var(--void); border: 1px solid var(--hairline-2); border-radius: var(--radius); outline: none; transition: border-color 0.15s;
}
.v-search input:focus { border-color: var(--blood); }
.v-selects { display: flex; flex-wrap: wrap; gap: 10px; }
.v-selects select {
  padding: 12px 14px; font-family: var(--f-body); font-size: 13.5px; color: var(--bone); cursor: pointer;
  background: var(--void); border: 1px solid var(--hairline-2); border-radius: var(--radius); outline: none;
}
.v-selects select:focus { border-color: var(--blood); }

/* ---- Recordings grid + cards ---------------------------------------------- */
.v-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
.vcard {
  background: var(--charcoal); border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden;
  cursor: pointer; transition: transform 0.3s var(--ease), border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
  display: flex; flex-direction: column;
}
.vcard:hover { transform: translateY(-6px); border-color: rgba(211,47,47,0.5); box-shadow: 0 24px 60px rgba(0,0,0,0.5), var(--glow-red); }
.vcard:focus-visible { outline: 2px solid var(--blood); outline-offset: 2px; }
.vthumb { position: relative; aspect-ratio: 16 / 9; background: #0a0a0e; overflow: hidden; }
.vthumb img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s var(--ease); }
.vcard:hover .vthumb img { transform: scale(1.06); }
.vthumb.no-thumb { background: repeating-linear-gradient(45deg, #131318 0 10px, #0e0e12 10px 20px); }
.vplay {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2;
  width: 54px; height: 54px; border-radius: 50%; opacity: 0; transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
  background: rgba(211,47,47,0.92); border: 2px solid rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center;
}
.vplay .tri { border-width: 9px 0 9px 15px; margin-left: 4px; }
.vcard:hover .vplay { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
.vdur {
  position: absolute; bottom: 8px; right: 8px; z-index: 2;
  font-family: var(--f-data); font-size: 11px; color: #fff; background: rgba(0,0,0,0.8); padding: 3px 7px; border-radius: 3px;
}
.vcat {
  position: absolute; top: 8px; left: 8px; z-index: 2;
  font-family: var(--f-head); text-transform: uppercase; letter-spacing: 1px; font-size: 10px; color: #fff;
  background: var(--blood); padding: 4px 8px; border-radius: 3px;
}
.vbody { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.vtitle { font-family: var(--f-head); font-weight: 600; font-size: 16px; line-height: 1.25; color: var(--bone); }
.vmeta { font-family: var(--f-data); font-size: 12px; color: var(--smoke); display: flex; gap: 6px; flex-wrap: wrap; }
.vdesc { color: var(--silver); font-size: 13.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vwatch { margin-top: auto; font-family: var(--f-head); text-transform: uppercase; letter-spacing: 1.5px; font-size: 12px; color: var(--blood); display: inline-flex; align-items: center; gap: 6px; }
.vwatch .arrow { transition: transform 0.3s var(--ease); }
.vcard:hover .vwatch .arrow { transform: translateX(4px); }

/* ---- Video modal (embedded player) ---------------------------------------- */
.vmodal { display: flex; flex-direction: column; }
.vmodal-player { position: relative; aspect-ratio: 16 / 9; width: 100%; background: #000; }
.vmodal-player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.vmodal-noembed { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--smoke); font-size: 14px; text-align: center; padding: 20px; }
.vmodal-info { padding: 24px 28px 28px; }
.vmodal-cat { display: inline-block; font-family: var(--f-head); text-transform: uppercase; letter-spacing: 1px; font-size: 10px; color: #fff; background: var(--blood); padding: 4px 9px; border-radius: 3px; margin-bottom: 12px; }
.vmodal-info h2 { font-family: var(--f-display); font-size: clamp(24px, 3.5vw, 38px); text-transform: uppercase; line-height: 1; }
.vmodal-meta { font-family: var(--f-data); font-size: 12.5px; color: var(--smoke); display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 14px; }
.vmodal-info p { color: var(--silver); font-size: 14.5px; line-height: 1.6; }

/* ---- Responsive ----------------------------------------------------------- */
@media (max-width: 900px) {
  .live-wrap { grid-template-columns: 1fr; }
  .live-off  { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .v-toolbar { flex-direction: column; align-items: stretch; }
  .v-selects { display: grid; grid-template-columns: 1fr 1fr; }
  .v-selects select { width: 100%; }
  .v-grid { grid-template-columns: 1fr; }
  .live-play { width: 66px; height: 66px; }
  .caro-arrow { display: none; }
}

/* ============================================================================
   SPONSOR LOGOS · EVENT BANNERS · CLOUD STATUS   (added features)
   ============================================================================ */

/* Partner logos — probed from assets/sponsors/<name>.png|jpg|jpeg.
   The logo shows if the file exists; otherwise the text name is the fallback. */
.sponsor { display: inline-flex; align-items: center; }
.sponsor-logo {
  max-height: 48px; max-width: 160px; width: auto; object-fit: contain;
  filter: grayscale(1) brightness(1.6); opacity: 0.75;
  transition: filter 0.3s var(--ease), opacity 0.3s var(--ease), transform 0.3s var(--ease);
}
.sponsor:hover .sponsor-logo { filter: grayscale(0) brightness(1); opacity: 1; transform: translateY(-2px); }

/* Event banners — probed from assets/banners/<event>.png|jpg|jpeg.
   Shows above the main event, inside expanded history rows, and on posters. */
.evt-banner { width: 100%; margin: 0 0 16px; border-radius: var(--radius); overflow: hidden; line-height: 0; }
.evt-banner img {
  width: 100%; height: clamp(120px, 22vw, 190px); object-fit: cover; display: block;
  border: 1px solid var(--hairline);
}
.poster .evt-banner { margin-bottom: 14px; }
.poster .evt-banner img { height: 120px; }
.tl-body-inner .evt-banner img { height: clamp(110px, 18vw, 160px); }

/* Cloud publish status chip in the admin header. */
.cloud-status {
  font-family: var(--f-head); text-transform: uppercase; letter-spacing: 1px; font-size: 11px;
  padding: 6px 11px; border-radius: 3px; white-space: nowrap; transition: opacity 0.2s var(--ease);
}
.cloud-status:empty { display: none; }
.cloud-status.saving { color: #f0c000; background: rgba(240, 192, 0, 0.12); }
.cloud-status.ok     { color: #59d071; background: rgba(76, 175, 80, 0.16); }
.cloud-status.fail   { color: #f0a0a0; background: rgba(211, 47, 47, 0.16); }

/* Admin image upload field (sponsor logos / event banners) */
.img-field { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.img-preview img { height: 54px; max-width: 170px; object-fit: cover; border: 1px solid var(--hairline-2); border-radius: var(--radius); display: block; background: var(--void); }
.img-upload {
  display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  font-family: var(--f-head); text-transform: uppercase; letter-spacing: 1px; font-size: 11px;
  padding: 9px 14px; background: var(--raised); color: var(--bone);
  border: 1px solid var(--hairline-2); border-radius: var(--radius); transition: all 0.15s var(--ease);
}
.img-upload:hover { border-color: var(--blood); color: #fff; }
.img-upload input[type="file"] { display: none; }
.img-status { font-family: var(--f-data); font-size: 12px; }
.img-status.up  { color: #f0c000; }
.img-status.ok  { color: #59d071; }
.img-status.err { color: #f0a0a0; }

/* ============================================================================
   DEDICATED FIGHTER PROFILE PAGE  (route #fighter=Username)
   ============================================================================ */
#view-fighter { padding: calc(var(--nav-h) + 30px) var(--pad-x) 90px; max-width: var(--maxw); margin: 0 auto; }
.fp-back { margin-bottom: 22px; }
.fp-hero { display: grid; grid-template-columns: minmax(200px, 300px) 1fr; gap: 40px; align-items: start; }
.fp-skin .skin-frame { width: 100%; background: var(--stage); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 20px; }
.fp-skin .skin-frame img { width: 100%; height: auto; image-rendering: pixelated; }
.fp-meta { display: flex; flex-direction: column; gap: 4px; }
.fp-name { font-family: var(--f-display); font-size: clamp(40px, 7vw, 84px); line-height: 0.92; text-transform: uppercase; margin: 10px 0 2px; }
.fp-nick { font-family: var(--f-head); text-transform: uppercase; letter-spacing: 3px; color: var(--blood); font-size: clamp(14px, 2vw, 20px); margin-bottom: 14px; }
.fp-record { font-family: var(--f-data); font-size: 30px; color: var(--bone); font-weight: 700; }
.fp-record-l { font-size: 14px; color: var(--smoke); font-weight: 400; letter-spacing: 1px; }
.fp-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 22px 0; max-width: 460px; }
.fp-stat { background: var(--charcoal); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 16px 10px; text-align: center; }
.fp-stat .n { font-family: var(--f-display); font-size: 30px; line-height: 1; }
.fp-stat .n.w { color: #59d071; }
.fp-stat .n.l { color: var(--smoke); }
.fp-stat .n.k { color: var(--ember); }
.fp-stat .n.s { color: var(--gold); }
.fp-stat .l2 { font-family: var(--f-head); text-transform: uppercase; letter-spacing: 1px; font-size: 10px; color: var(--smoke); margin-top: 8px; }
.fp-bio { color: var(--silver); font-size: 15px; line-height: 1.7; max-width: 620px; }
.fp-next { margin: 34px 0 0; padding: 18px 22px; background: var(--glass); border: 1px solid var(--hairline); border-left: 3px solid var(--blood); border-radius: var(--radius); }
.fp-next-row { margin-top: 6px; color: var(--bone); }
.fp-history { margin-top: 40px; }
.fp-h { font-family: var(--f-head); text-transform: uppercase; letter-spacing: 2px; font-size: 20px; margin-bottom: 16px; border-bottom: 1px solid var(--hairline); padding-bottom: 12px; }

@media (max-width: 720px) {
  .fp-hero { grid-template-columns: 1fr; gap: 24px; }
  .fp-skin { max-width: 240px; margin: 0 auto; }
  .fp-meta { text-align: center; align-items: center; }
  .fp-stats { max-width: none; }
}

/* Admin: log-result button, needs-result badge, champion toggle */
.btn-result { color: #7fd0ff; border-color: rgba(90,160,255,0.4); }
.btn-result:hover { background: #2a6df0; color: #fff; border-color: #2a6df0; }
.needs-result { font-family: var(--f-head); text-transform: uppercase; letter-spacing: 1px; font-size: 10px; color: #f0c000; background: rgba(240,192,0,0.12); padding: 3px 8px; border-radius: 3px; margin-left: 8px; white-space: nowrap; }
.btn-champ-on { color: var(--gold) !important; border-color: rgba(245,197,66,0.5) !important; background: rgba(245,197,66,0.1) !important; }
.ra-row.is-champ { border-color: rgba(245,197,66,0.4); }

/* ============================================================================
   HERO NEWS RAILS · headlines flanking the hero (only render when articles exist)
   ============================================================================ */
.hero-news {
  position: absolute; top: 15%; bottom: 12%; width: clamp(200px, 23vw, 320px);
  display: flex; flex-direction: column; justify-content: space-evenly; gap: 12px;
  z-index: 3; pointer-events: none;   /* empty column space never blocks the hero */
}
.hero-news.left  { left: clamp(16px, 3vw, 52px);  align-items: flex-start; text-align: left; }
.hero-news.right { right: clamp(16px, 3vw, 52px); align-items: flex-end;  text-align: right; }
.hn-item {
  pointer-events: auto; cursor: pointer; background: none; border: 0; padding: 0;
  display: block; width: 100%; -webkit-appearance: none; appearance: none;
}
.hn-title {
  font-family: var(--f-head); font-weight: 600; font-size: clamp(18px, 1.7vw, 27px);
  line-height: 1.12; color: var(--bone); padding-bottom: 9px;
  border-bottom: 2px solid var(--blood); transition: color 0.2s var(--ease);
}
.hn-more {
  margin-top: 7px; font-family: var(--f-body); font-size: clamp(13px, 1vw, 16px);
  color: var(--smoke); transition: color 0.2s var(--ease);
}
.hn-item:hover .hn-title { color: #fff; }
.hn-item:hover .hn-more  { color: var(--blood); }

/* Only on wide screens — below this the hero has no room, so news lives in
   "The Wire" section further down the page instead. */
@media (max-width: 1120px) { .hero-news { display: none; } }

/* ==========================================================================
   TICKETS · MEMBERSHIPS · DISCORD ACCOUNT
   ========================================================================== */
.nav-account { display:flex; align-items:center; gap:8px; margin-left:8px; padding-left:12px; border-left:1px solid var(--hairline); }
.nav-auth { font-family:var(--f-head); font-weight:700; font-size:11px; letter-spacing:1.4px; text-transform:uppercase; padding:9px 12px; border:1px solid rgba(88,101,242,.55); color:#cfd3ff; border-radius:var(--radius); white-space:nowrap; }
.nav-auth:hover { background:#5865f2; border-color:#5865f2; color:#fff; }
.nav-user { max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--f-head); font-size:12px; color:var(--silver); }
.commerce-page { min-height:calc(100vh - var(--nav-h)); }
.ticket-events { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:22px; }
.ticket-event { overflow:hidden; }
.ticket-event.selected { border-color:var(--blood); box-shadow:var(--glow-red); }
.ticket-banner { height:160px; overflow:hidden; }
.ticket-banner img { width:100%; height:100%; object-fit:cover; }
.ticket-event-body { padding:24px; }
.ticket-event h3 { margin:14px 0 6px; font-family:var(--f-display); font-size:32px; line-height:1; text-transform:uppercase; }
.ticket-event p { color:var(--silver); margin-bottom:15px; }
.ticket-event p b { color:var(--blood); font-family:var(--f-head); text-transform:uppercase; margin:0 5px; }
.ticket-meta { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-family:var(--f-data); font-size:11px; color:var(--smoke); margin-bottom:20px; }
.seat-picker { margin-top:38px; padding:clamp(20px,4vw,40px); background:var(--charcoal); border:1px solid var(--hairline-2); border-radius:var(--radius); }
.seat-picker-head { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:32px; }
.seat-picker-head h2 { font-family:var(--f-display); font-size:clamp(30px,5vw,52px); text-transform:uppercase; line-height:1; margin-top:12px; }
.arena-screen { width:min(760px,92%); margin:0 auto 40px; height:54px; display:flex; align-items:center; justify-content:center; color:var(--smoke); font-family:var(--f-pixel); font-size:9px; letter-spacing:3px; border-top:4px solid var(--blood); background:linear-gradient(180deg,rgba(211,47,47,.18),transparent 72%); clip-path:polygon(4% 0,96% 0,100% 100%,0 100%); }
.seat-map { display:flex; flex-direction:column; gap:10px; overflow-x:auto; padding:0 0 12px; }
.seat-row { display:flex; align-items:center; justify-content:center; gap:12px; min-width:max-content; }
.seat-row-label { width:20px; color:var(--smoke); font-family:var(--f-data); font-size:12px; text-align:center; }
.seat-row-seats { display:flex; gap:8px; }
.seat { width:32px; height:32px; background:var(--raised); border:1px solid var(--hairline-2); border-radius:3px 3px 7px 7px; font:700 10px var(--f-data); color:var(--silver); transition:.15s ease; }
.seat:not(:disabled):hover { border-color:var(--blood); color:#fff; transform:translateY(-2px); }
.seat.selected,.seat-demo.selected { background:var(--blood); border-color:var(--blood-hi); color:#fff; box-shadow:0 0 14px rgba(211,47,47,.5); }
.seat.unavailable,.seat-demo.unavailable { background:#101014; border-color:#222229; color:#41414a; cursor:not-allowed; text-decoration:line-through; }
.seat-legend { display:flex; justify-content:center; gap:22px; flex-wrap:wrap; margin:22px 0; font-size:12px; color:var(--smoke); }
.seat-legend span { display:flex; align-items:center; gap:7px; }
.seat-demo { display:inline-block; width:18px; height:18px; background:var(--raised); border:1px solid var(--hairline-2); border-radius:2px 2px 5px 5px; }
.ticket-summary { display:grid; grid-template-columns:1fr 1fr auto; align-items:center; gap:20px; padding:20px; border-top:1px solid var(--hairline); background:rgba(0,0,0,.18); }
.ticket-summary div { display:flex; flex-direction:column; }
.ticket-summary span { font-family:var(--f-head); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--smoke); }
.ticket-summary strong { font-family:var(--f-data); font-size:14px; color:var(--bone); }
.ticket-summary .btn:disabled { opacity:.4; cursor:not-allowed; box-shadow:none; }
.ticket-status,.commerce-note { margin-top:14px; color:var(--smoke); font-size:12px; text-align:center; }
.membership-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:22px; align-items:stretch; }
.membership-card { padding:32px; display:flex; flex-direction:column; min-height:450px; overflow:visible; }
.membership-card.featured-plan { border-color:rgba(211,47,47,.6); box-shadow:var(--glow-red); transform:translateY(-8px); }
.membership-card.featured-plan:hover { transform:translateY(-12px); }
.plan-badge { position:absolute; top:-13px; right:18px; padding:6px 10px; background:var(--blood); color:#fff; font:700 10px var(--f-head); letter-spacing:1.4px; text-transform:uppercase; }
.membership-card h2 { margin:18px 0 10px; font-family:var(--f-display); font-size:42px; line-height:1; text-transform:uppercase; }
.plan-price { display:flex; align-items:baseline; gap:8px; margin-bottom:18px; }
.plan-price strong { font:38px/1 var(--f-display); color:var(--bone); }
.plan-price span { color:var(--smoke); font-size:12px; }
.membership-card > p { color:var(--silver); font-size:14px; min-height:48px; }
.membership-card ul { list-style:none; display:flex; flex-direction:column; gap:11px; margin:24px 0 30px; flex:1; }
.membership-card li { color:var(--silver); font-size:13px; padding-left:20px; position:relative; }
.membership-card li::before { content:"+"; position:absolute; left:0; color:var(--blood); font-family:var(--f-data); font-weight:700; }
.afield-group { margin:18px 0; padding:18px; border:1px solid var(--hairline-2); background:rgba(255,255,255,.015); }
.afield-group legend { padding:0 8px; font-family:var(--f-head); font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--bone); }

@media (max-width: 1240px) and (min-width: 901px) {
  .nav-link { padding-left:8px; padding-right:8px; font-size:11px; letter-spacing:1px; }
  .nav-link::after { left:8px; right:8px; }
  .nav-user { display:none; }
}
@media (max-width: 900px) {
  .nav-account { margin:10px 0 0; padding:16px 0 0; border-left:0; border-top:1px solid var(--hairline); width:100%; justify-content:center; }
  .ticket-summary { grid-template-columns:1fr 1fr; }
  .ticket-summary .btn { grid-column:1 / -1; }
  .membership-card.featured-plan { transform:none; }
}
@media (max-width: 560px) {
  .seat-picker { padding:18px 10px; }
  .seat-picker-head { padding:0 8px; }
  .ticket-summary { grid-template-columns:1fr; }
  .ticket-summary .btn { grid-column:auto; width:100%; }
}

</style>

  // Draw the fighter grid (used again by search).
  function drawRoster(list) {
    const wrap = $("#roster");
    if (!list.length) { wrap.innerHTML = `<div class="no-results">No fighters match that search</div>`; return; }
    // Sort the displayed roster by rank so the champ leads; unranked go last.
    const rk = (n) => { const r = rankOf(n); return r > 0 ? r : 9999; };
    const sorted = [...list].sort((a, b) => rk(a.username) - rk(b.username));
    wrap.innerHTML = sorted.map((f) => `
      <article class="card fighter-card reveal in" data-fighter="${esc(f.username)}" role="button" tabindex="0">
        ${rankOf(f.username) ? `<span class="rank-tag">#${rankOf(f.username)}</span>` : ""}
        ${f.champion ? `<span class="champ-mini champ-badge">★</span>` : ""}
        <div class="skin-frame"><img src="${skinBody(f.skin || f.username)}" ${onSkinError} alt="${esc(f.username)}"></div>
        <div class="fc-name">${esc(f.username)}</div>
        <div class="fc-style">${esc(f.nickname)}</div>
        <div class="fc-foot">
          <span class="record"><span class="w">${f.wins}</span>-<span class="l">${f.losses}</span></span>
          <span class="fc-rank">${f.koPercent}% KO</span>
        </div>
      </article>`).join("");
  }
